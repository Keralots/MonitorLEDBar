<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f4f6f9; stroke: #4a5568; stroke-width: 2; }
    .mcu { fill: #1f2d3d; stroke: #111; stroke-width: 2; }
    .title { font-size: 17px; font-weight: 700; fill: #1a202c; text-anchor: middle; }
    .sub { font-size: 13px; fill: #4a5568; text-anchor: middle; }
    .warn { font-size: 13px; fill: #c53030; font-weight: 600; text-anchor: middle; }
    .pin { font-size: 13px; fill: #2d3748; font-weight: 600; }
    .pinw { font-size: 13px; fill: #e2e8f0; font-weight: 600; }
    .lbl { font-size: 13px; fill: #2d3748; }
    .w { fill: none; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
    .v12 { stroke: #d7263d; }
    .v5 { stroke: #f08a24; }
    .v33 { stroke: #8e44ad; }
    .gnd { stroke: #2d3748; }
    .sig { stroke: #1f77b4; }
    .gate { stroke: #2a9d8f; }
    .dot { stroke: none; }
    .pd { fill: #fff; stroke: #4a5568; stroke-width: 2; }
  </style>

  <rect width="1400" height="1000" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="30" y="38" font-size="24" font-weight="700" fill="#1a202c">MonitorLEDBar - wiring</text>
  <g font-size="13" fill="#2d3748">
    <line x1="760" y1="33" x2="790" y2="33" class="w v12"/><text x="796" y="38">12 V</text>
    <line x1="850" y1="33" x2="880" y2="33" class="w v5"/><text x="886" y="38">5 V</text>
    <line x1="930" y1="33" x2="960" y2="33" class="w v33"/><text x="966" y="38">3.3 V</text>
    <line x1="1020" y1="33" x2="1050" y2="33" class="w gnd"/><text x="1056" y="38">GND</text>
    <line x1="1110" y1="33" x2="1140" y2="33" class="w sig"/><text x="1146" y="38">Touch signal</text>
    <line x1="1250" y1="33" x2="1280" y2="33" class="w gate"/><text x="1286" y="38">PWM gate</text>
  </g>

  <!-- Rails -->
  <polyline class="w v12" points="250,140 1340,140"/>
  <text x="560" y="130" class="lbl" fill="#d7263d">+12 V rail</text>
  <polyline class="w gnd" points="270,840 1190,840"/>
  <text x="560" y="862" class="lbl">GND rail (common ground)</text>

  <!-- PD trigger -->
  <rect x="30" y="60" width="220" height="140" rx="10" class="box"/>
  <text x="140" y="90" class="title">USB-C PD trigger</text>
  <text x="140" y="110" class="sub">set to 12 V</text>
  <text x="240" y="145" class="pin" text-anchor="end">VOUT+</text>
  <text x="240" y="180" class="pin" text-anchor="end">VOUT-</text>
  <circle cx="250" cy="140" r="5" class="pd"/>
  <circle cx="250" cy="175" r="5" class="pd"/>
  <polyline class="w gnd" points="250,175 270,175 270,840"/>

  <!-- C1 bulk cap -->
  <polyline class="w v12" points="320,140 320,296"/>
  <line x1="296" y1="296" x2="344" y2="296" stroke="#2d3748" stroke-width="4"/>
  <path d="M296,314 Q320,304 344,314" fill="none" stroke="#2d3748" stroke-width="4"/>
  <text x="302" y="290" class="lbl" font-weight="700">+</text>
  <polyline class="w gnd" points="320,310 320,840"/>
  <g font-size="12" fill="#2d3748">
    <text x="327" y="345" font-weight="700">C1</text>
    <text x="327" y="361">470uF</text>
    <text x="327" y="377">25V</text>
    <text x="327" y="393" fill="#718096">(opt.)</text>
  </g>

  <!-- Mini-360 buck -->
  <polyline class="w v12" points="370,140 370,260 400,260"/>
  <polyline class="w gnd" points="400,320 385,320 385,840"/>
  <rect x="400" y="220" width="190" height="130" rx="10" class="box"/>
  <text x="495" y="245" class="title">Mini-360 buck</text>
  <text x="410" y="265" class="pin">IN+</text>
  <text x="410" y="325" class="pin">IN-</text>
  <text x="580" y="265" class="pin" text-anchor="end">OUT+</text>
  <text x="580" y="325" class="pin" text-anchor="end">OUT-</text>
  <text x="495" y="370" class="warn">Trim to 5.0 V BEFORE</text>
  <text x="495" y="386" class="warn">connecting the ESP</text>
  <circle cx="400" cy="260" r="5" class="pd"/>
  <circle cx="400" cy="320" r="5" class="pd"/>
  <circle cx="590" cy="260" r="5" class="pd"/>
  <circle cx="590" cy="320" r="5" class="pd"/>
  <polyline class="w gnd" points="590,320 615,320 615,840"/>

  <!-- D1 Schottky -->
  <polyline class="w v5" points="590,260 624,260"/>
  <polygon points="624,247 624,273 650,260" fill="#2d3748"/>
  <line x1="652" y1="246" x2="652" y2="274" stroke="#2d3748" stroke-width="4"/>
  <polyline class="w v5" points="652,260 720,260"/>
  <text x="637" y="236" class="lbl" text-anchor="middle" font-weight="700">D1</text>
  <text x="637" y="298" class="lbl" text-anchor="middle">1N5819</text>
  <text x="637" y="314" class="lbl" text-anchor="middle">/ SS14</text>

  <!-- ESP32-C3 SuperMini -->
  <rect x="820" y="198" width="40" height="14" rx="3" fill="#a0aec0" stroke="#4a5568"/>
  <text x="840" y="192" class="sub">USB-C</text>
  <rect x="720" y="210" width="240" height="220" rx="10" class="mcu"/>
  <text x="840" y="300" class="title" fill="#ffffff" style="fill:#fff">ESP32-C3</text>
  <text x="840" y="320" class="title" style="fill:#fff">SuperMini</text>
  <text x="840" y="345" class="sub" style="fill:#a0aec0">logical view, not</text>
  <text x="840" y="361" class="sub" style="fill:#a0aec0">physical pin order</text>
  <text x="732" y="265" class="pinw">5V</text>
  <text x="732" y="325" class="pinw">GND</text>
  <text x="948" y="305" class="pinw" text-anchor="end">GPIO10</text>
  <text x="780" y="418" class="pinw" text-anchor="middle">GPIO0</text>
  <text x="840" y="418" class="pinw" text-anchor="middle">3V3</text>
  <text x="900" y="418" class="pinw" text-anchor="middle">GPIO1</text>
  <circle cx="720" cy="260" r="5" class="pd"/>
  <circle cx="720" cy="320" r="5" class="pd"/>
  <circle cx="960" cy="300" r="5" class="pd"/>
  <circle cx="780" cy="430" r="5" class="pd"/>
  <circle cx="840" cy="430" r="5" class="pd"/>
  <circle cx="900" cy="430" r="5" class="pd"/>
  <polyline class="w gnd" points="720,320 650,320 650,840"/>

  <!-- Touch wiring -->
  <polyline class="w sig" points="780,430 780,480 730,480 730,560"/>
  <polyline class="w sig" points="900,430 900,480 980,480 980,560"/>
  <polyline class="w v33" points="840,430 840,510"/>
  <polyline class="w v33" points="800,560 800,510 910,510 910,560"/>

  <!-- T1 -->
  <rect x="700" y="560" width="140" height="120" rx="10" class="box"/>
  <text x="730" y="580" class="pin" text-anchor="middle">I/O</text>
  <text x="800" y="580" class="pin" text-anchor="middle">VCC</text>
  <text x="770" y="615" class="title">T1 TTP223</text>
  <text x="770" y="635" class="sub">dim / off</text>
  <text x="770" y="668" class="pin" text-anchor="middle">GND</text>
  <circle cx="730" cy="560" r="5" class="pd"/>
  <circle cx="800" cy="560" r="5" class="pd"/>
  <circle cx="770" cy="680" r="5" class="pd"/>
  <polyline class="w gnd" points="770,680 770,840"/>

  <!-- T2 -->
  <rect x="880" y="560" width="140" height="120" rx="10" class="box"/>
  <text x="910" y="580" class="pin" text-anchor="middle">VCC</text>
  <text x="980" y="580" class="pin" text-anchor="middle">I/O</text>
  <text x="950" y="615" class="title">T2 TTP223</text>
  <text x="950" y="635" class="sub">brighten / on</text>
  <text x="950" y="668" class="pin" text-anchor="middle">GND</text>
  <circle cx="910" cy="560" r="5" class="pd"/>
  <circle cx="980" cy="560" r="5" class="pd"/>
  <circle cx="950" cy="680" r="5" class="pd"/>
  <polyline class="w gnd" points="950,680 950,840"/>

  <!-- Gate drive: R1 series, R2 pull-down -->
  <polyline class="w gate" points="960,300 1000,300 1000,540 1030,540"/>
  <rect x="1030" y="531" width="44" height="18" rx="2" fill="#fff" stroke="#2d3748" stroke-width="2.5"/>
  <text x="1052" y="522" class="lbl" text-anchor="middle" font-weight="700">R1 100R</text>
  <polyline class="w gate" points="1074,540 1120,540"/>
  <polyline class="w gate" points="1095,540 1095,590"/>
  <rect x="1086" y="590" width="18" height="44" rx="2" fill="#fff" stroke="#2d3748" stroke-width="2.5"/>
  <text x="1080" y="607" class="lbl" text-anchor="end" font-weight="700">R2</text>
  <text x="1080" y="624" class="lbl" text-anchor="end">10k</text>
  <polyline class="w gnd" points="1095,634 1095,840"/>

  <!-- Q1 IRLZ44N -->
  <rect x="1120" y="480" width="140" height="140" rx="10" class="box"/>
  <text x="1205" y="530" class="title">Q1</text>
  <text x="1205" y="550" class="title">IRLZ44N</text>
  <text x="1132" y="545" class="pin">G</text>
  <text x="1190" y="500" class="pin" text-anchor="middle">D</text>
  <text x="1190" y="610" class="pin" text-anchor="middle">S</text>
  <text x="1270" y="580" class="lbl">TO-220 front:</text>
  <text x="1270" y="597" class="lbl">1=G 2=D 3=S</text>
  <text x="1270" y="614" class="lbl">tab = D</text>
  <circle cx="1120" cy="540" r="5" class="pd"/>
  <circle cx="1190" cy="480" r="5" class="pd"/>
  <circle cx="1190" cy="620" r="5" class="pd"/>
  <polyline class="w gnd" points="1190,620 1190,840"/>

  <!-- LED strip -->
  <polyline class="w v12" points="1340,140 1340,220"/>
  <rect x="1120" y="220" width="250" height="80" rx="8" fill="#fffbea" stroke="#b7791f" stroke-width="2"/>
  <g fill="#f6e05e" stroke="#b7791f" stroke-width="1.5">
    <rect x="1150" y="266" width="16" height="12" rx="2"/><rect x="1185" y="266" width="16" height="12" rx="2"/>
    <rect x="1220" y="266" width="16" height="12" rx="2"/><rect x="1255" y="266" width="16" height="12" rx="2"/>
    <rect x="1290" y="266" width="16" height="12" rx="2"/><rect x="1325" y="266" width="16" height="12" rx="2"/>
  </g>
  <text x="1245" y="250" class="title">12 V LED strip</text>
  <text x="1340" y="238" class="pin" text-anchor="middle">+</text>
  <text x="1203" y="294" class="pin" font-size="16">-</text>
  <circle cx="1340" cy="220" r="5" class="pd"/>
  <circle cx="1190" cy="300" r="5" class="pd"/>
  <polyline class="w v12" points="1190,300 1190,480" style="stroke:#9b2c2c; stroke-dasharray: 10 6"/>
  <text x="1200" y="400" class="lbl">strip - to drain</text>
  <text x="1200" y="417" class="lbl" fill="#718096">(switched low side)</text>

  <!-- Junctions -->
  <g class="dot">
    <circle cx="320" cy="140" r="6" fill="#d7263d"/>
    <circle cx="370" cy="140" r="6" fill="#d7263d"/>
    <circle cx="320" cy="840" r="6" fill="#2d3748"/>
    <circle cx="385" cy="840" r="6" fill="#2d3748"/>
    <circle cx="615" cy="840" r="6" fill="#2d3748"/>
    <circle cx="650" cy="840" r="6" fill="#2d3748"/>
    <circle cx="770" cy="840" r="6" fill="#2d3748"/>
    <circle cx="950" cy="840" r="6" fill="#2d3748"/>
    <circle cx="1095" cy="840" r="6" fill="#2d3748"/>
    <circle cx="840" cy="510" r="6" fill="#8e44ad"/>
    <circle cx="1095" cy="540" r="6" fill="#2a9d8f"/>
  </g>

  <!-- Notes -->
  <rect x="30" y="885" width="1340" height="95" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
  <g font-size="13.5" fill="#2d3748">
    <text x="50" y="910">1. Charger must offer a 12 V PD profile (some only do 5/9 V). Keep all grounds common.</text>
    <text x="50" y="930">2. D1 lets USB be plugged in for flashing while 12 V is on. Without D1, never connect USB with 12 V powered.</text>
    <text x="50" y="950">3. R2 holds the gate low during boot so the strip stays off. Size 12 V and strip - wires for full strip current.</text>
    <text x="50" y="970">4. TTP223 modules at default jumpers (momentary, active HIGH). Do not touch pads for ~1 s after power-up (baseline calibration).</text>
  </g>
</svg>
